version: '3.8'

services:
  nextjs:
    build: .
    container_name: ning-k-chen-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - web

  nginx:
    image: nginx:alpine
    container_name: ning-k-chen-nginx
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - nextjs
    networks:
      - web

  certbot:
    image: certbot/certbot
    container_name: ning-k-chen-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    command: certonly --webroot --webroot-path=/var/www/certbot --email admin@nkchen.dev --agree-tos --no-eff-email -d nkchen.dev

networks:
  web:
    driver: bridge
